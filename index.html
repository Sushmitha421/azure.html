<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FOOD ITEMS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #fff;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .logo {
      color: #fc8019;
      font-size: 28px;
      font-weight: bold;
    }

    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #333;
      font-weight: 600;
    }

    .hero {
      background: #fc8019;
      color: white;
      padding: 60px 40px;
      text-align: center;
    }

    .hero input {
      padding: 12px;
      width: 260px;
      border: none;
      border-radius: 4px;
    }

    .hero button {
      padding: 12px 20px;
      border: none;
      background: #333;
      color: white;
      cursor: pointer;
      margin-left: 5px;
    }

    .section {
      padding: 40px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    footer {
      background: black;
      color: #ccc;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Swiggy</div>
  <nav>
    <a href="#">Search</a>
    <a href="#">Offers</a>
    <a href="#">Help</a>
    <a href="#">Sign In</a>
    <a href="#">Cart</a>
  </nav>
</header>

<section class="hero">
  <h1>Order food from your favourite restaurants</h1>
  <p>Fast delivery | Best offers</p>
  <input type="text" placeholder="Enter delivery location">
  <button>Search</button>
</section>

<section class="section">
  <h2>Popular Restaurants</h2>
  <div class="cards">
    <div class="card">Biryani House ⭐ 4.3</div>
    <div class="card">Pizza Hub ⭐ 4.5</div>
    <div class="card">Burger King ⭐ 4.2</div>
    <div class="card">Sweet Treats ⭐ 4.6</div>
  </div>
</section>

<footer>
  © 2026 Swiggy Clone – For Learning Purpose Only
</footer>

</body>
</html>
